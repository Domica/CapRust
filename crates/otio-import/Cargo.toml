[package]
name = "caprust-otio-import"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "OTIO (.otio JSON) importer plugin for CapRust"

[[bin]]
name = "caprust-otio-import"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
