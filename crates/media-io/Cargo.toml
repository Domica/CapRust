[package]
name = "caprust-media-io"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
caprust-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
cpal = { workspace = true }
ringbuf = { workspace = true }
ureq = { workspace = true }
zip = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
blake3 = { workspace = true }

# Whisper.cpp bindings for AI captions (Phase F2).
# default-features = false disables Vulkan/CUDA/Metal backends; the
# CPU backend is plenty for short-form content and keeps CI builds
# portable. GPU support can be added later behind a feature flag.
whisper-rs = { version = "0.14", default-features = false }

# Pure-Rust ONNX runtime for YuNet face detection (Phase P2).
tract-onnx = { workspace = true }

# ONNX Runtime with optional GPU execution providers (CUDA/DirectML).
ort = { workspace = true, optional = true }

[dependencies.ffmpeg-next]
workspace = true
optional = true

# CLAP plugin hosting (Phase I). Feature-gated so CI without the CLAP
# SDK can build the workspace without pulling clack-host. Same pattern
# as `ffmpeg` (DIRECTIVES 10.6).
[dependencies.clack-host]
version = "0.2"
optional = true

[dependencies.clack-extensions]
version = "0.2"
optional = true

[features]
ffmpeg = ["dep:ffmpeg-next"]
clap = ["dep:clack-host", "dep:clack-extensions"]
# GPU acceleration for ONNX inference (GFPGAN, SCRFD, etc.)
gpu-cuda = ["ort/cuda"]
gpu-directml = ["ort/directml"]

# Enable CUDA by default on all targets except Android (no CUDA prebuilt
# binaries exist for aarch64-linux-android; ort-sys would fail to download them).
[target.'cfg(not(target_os = "android"))'.features]
default = ["gpu-cuda"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
