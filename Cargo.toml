[workspace]
members = [
    "crates/core",
    "crates/media-io",
    "crates/ui",
    "crates/i18n",
    "crates/app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
egui = "0.31"
eframe = { version = "0.31", features = ["persistence"] }
egui-phosphor = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
sys-locale = "0.3"
ffmpeg-next = "7"
fluent = "0.16"
fluent-bundle = "0.15"
unic-langid = "0.9"
once_cell = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
tokio = { version = "1", features = ["full"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
open = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
blake3 = "1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Face detection (auto-reframe, Phase P2).
# tract-onnx 0.23 is pure Rust (no libonnxruntime dependency). It
# added support for the pytorch_half_pixel Resize coordinate mode,
# which u2netp (and most PyTorch-exported ONNX models) rely on. MSRV
# is 1.91, pinned via rust-toolchain.toml.
tract-onnx = { version = "0.23", default-features = false }

# Audio playback (preview)
cpal = "0.15"
ringbuf = "0.4"
rfd = "0.15"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
