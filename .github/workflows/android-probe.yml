# Android feasibility probe.
#
# Answers one question: can the non-UI crates cross-compile for
# aarch64-linux-android? If this goes green, a native Android app is
# reachable. If it goes red, that is months saved.
#
# Manual trigger only. It is a probe, not a gate, so it must not run
# on every push.
#
# Split into steps on purpose: caprust-core is pure Rust and is
# expected to pass. caprust-media-io pulls whisper-rs, which compiles
# whisper.cpp from C++ source, and is the actual question. Separate
# steps mean a media-io failure still reports the core result.

name: Android probe

on:
  workflow_dispatch:
    inputs:
      with_whisper:
        description: "Also build caprust-media-io (whisper.cpp C++)"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  probe:
    name: cross-compile for aarch64-linux-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub-hosted ubuntu runners already ship the Android SDK and
      # NDK. Only the Rust target has to be added.
      - name: Report toolchain versions
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT:-unset}"
          echo "ANDROID_NDK_LATEST_HOME=${ANDROID_NDK_LATEST_HOME:-unset}"
          ls -d "$ANDROID_NDK_ROOT" 2>/dev/null || true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # rust-toolchain.toml pins 1.91.0, which overrides the action's
      # toolchain and drops the target we just added. Re-add it for the
      # pinned toolchain instead of assuming the action's list carried
      # over.
      - name: Install the Android target for the pinned toolchain
        run: |
          rustup show active-toolchain
          rustup target add aarch64-linux-android --toolchain "$(cat rust-toolchain.toml | grep channel | cut -d'"' -f2)"
          rustup target list --installed

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-probe

      # NDK ships clang wrappers per API level. API 21 is the floor
      # egui/winit supports and keeps the minSdk low.
      #
      # CC/CXX must be absolute paths: cc-rs resolves them directly and
      # does not go through the shell, so a bare wrapper name fails with
      # "No such file or directory" even after PATH is set. They also
      # end in a bare version number on purpose, which is what makes
      # them API-level specific instead of picking the host default.
      - name: Point cargo at the NDK clang wrappers
        run: |
          NDK="$ANDROID_NDK_ROOT"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK clang bin: $BIN"
          ls "$BIN" | grep -E 'aarch64.*clang' | head -5
          CC="$BIN/aarch64-linux-android21-clang"
          CXX="$BIN/aarch64-linux-android21-clang++"
          test -x "$CC" || { echo "missing $CC"; exit 1; }
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CC"
            echo "CC_aarch64_linux_android=$CC"
            echo "CXX_aarch64_linux_android=$CXX"
            echo "AR_aarch64_linux_android=$BIN/llvm-ar"
            echo "RANLIB_aarch64_linux_android=$BIN/llvm-ranlib"
            # cc/CMake build scripts need the API level, not just the
            # triple, or they guess a host triple.
            echo "ANDROID_API=21"
            # PATH too, for anything that shells out (cmake, make).
            echo "PATH=$BIN:$PATH"
          } >> "$GITHUB_ENV"
          echo "export PATH=\"$BIN:\$PATH\"" >> "$GITHUB_PATH"

      - name: Build caprust-core (pure Rust, expected to pass)
        run: cargo build --release -p caprust-core --target aarch64-linux-android

      - name: Build caprust-media-io (whisper.cpp C++, the real question)
        if: ${{ inputs.with_whisper }}
        # Do not abort the job: a failure here is the probe's answer,
        # and we still want the core result and the summary.
        continue-on-error: true
        run: cargo build --release -p caprust-media-io --target aarch64-linux-android

      # The phone app's engine. This is the crate that has to exist
      # before there is an app at all: it is the editing engine with
      # no UI, and it has to build for the phone.
      - name: Build caprust-android (the phone's engine)
        continue-on-error: true
        run: cargo build --release -p caprust-android --target aarch64-linux-android

      - name: Report
        if: always()
        run: |
          echo "=== probe result ==="
          OUT=target/aarch64-linux-android/release
          # Test for a file, not a directory. The first version of this
          # probe used `[ -d .../libcaprust_core.rlib ]`, which is always
          # false, so a fully successful build reported FAILED.
          for crate in caprust_core caprust_media_io; do
            if compgen -G "$OUT/lib${crate}.rlib" > /dev/null \
               || compgen -G "$OUT/lib${crate}.rmeta" > /dev/null; then
              echo "$crate: BUILT"
            else
              echo "$crate: NOT BUILT"
            fi
          done
          echo "--- native objects pulled in by the C dependencies ---"
          # zstd-sys (via the zip crate) and whisper.cpp (via whisper-rs)
          # are the reason this needed an NDK at all. Listing them makes
          # the cost visible instead of implied.
          find target/aarch64-linux-android/release/build -name '*.a' \
            -exec ls -la {} + 2>/dev/null | head -10 || echo "none"