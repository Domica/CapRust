name: Size Audit
# How big is the binary, and what is in it?
#
# The release exe passed 25 MB and the TODO says 20 MB. Guessing does
# not shrink a binary; this measures it. The build keeps its symbols
# (the release profile strips them) so cargo-bloat can attribute the
# code to the crates that made it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Windows size audit
    runs-on: windows-latest
    env:
      CMAKE_ARGS: -DGGML_NATIVE=OFF
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2

      - name: Build the release binary, with symbols
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_DEBUG: 1
        run: cargo build --release -p caprust-app --no-default-features

      - name: How big is it
        shell: pwsh
        run: |
          $exe = "target\release\caprust-app.exe"
          $mb = (Get-Item $exe).Length / 1MB
          Write-Host ("the release exe is {0:N2} MB" -f $mb)
          "size=$mb" | Out-File -Encoding ascii size.txt

      - name: Install cargo-bloat
        run: cargo install cargo-bloat --locked

      - name: The size per crate
        shell: pwsh
        run: |
          cargo bloat --release --crates -p caprust-app 2>&1 | Tee-Object -FilePath crates.txt

      - name: The size per function
        shell: pwsh
        run: |
          cargo bloat --release -n 60 -p caprust-app 2>&1 | Tee-Object -FilePath functions.txt

      - name: The data that is embedded
        shell: pwsh
        run: |
          cargo bloat --release --crates --data-sections -p caprust-app 2>&1 |
            Tee-Object -FilePath data.txt

      - uses: actions/upload-artifact@v4
        with:
          name: size-audit
          path: |
            size.txt
            crates.txt
            functions.txt
            data.txt
          retention-days: 14
