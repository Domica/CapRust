name: Nightly Build
on:
  push: { branches: ["main"] }
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows nightly .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p caprust-app --no-default-features
      - uses: actions/upload-artifact@v4
        with:
          name: caprust-nightly-win64
          path: target/release/caprust-app.exe
          retention-days: 14

  build-linux:
    name: Linux nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config clang libclang-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgtk-3-dev \
            libasound2-dev
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p caprust-app --no-default-features
      - uses: actions/upload-artifact@v4
        with:
          name: caprust-nightly-linux
          path: target/release/caprust-app
          retention-days: 14
