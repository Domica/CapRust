name: Release
# The release build lives in a workflow rather than on a laptop
# because SignPath only signs artifacts that a GitHub workflow produced.
# It verifies the origin of the build, so a binary assembled elsewhere
# and handed over with the API token is refused.
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.9.19"
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows release
    runs-on: windows-latest
    env:
      # whisper-rs-sys builds whisper.cpp from source, and the runners
      # have AVX-512, which the default GGML_NATIVE=ON bakes in. Older
      # CPUs then die during whisper decode.
      CMAKE_ARGS: -DGGML_NATIVE=OFF
      # The token is read through `env`, not through `secrets` in the
      # step's `if`: the secrets context is not available there.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $toml = Get-Content Cargo.toml -Raw
          if ($toml -notmatch 'version\s*=\s*"([^"]+)"') { throw "no version in Cargo.toml" }
          $fromToml = $Matches[1]
          # A tag push carries the version; a manual run says it.
          $wanted = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            "${{ github.ref_name }}" -replace '^v', ''
          }
          if ($wanted -ne $fromToml) {
            throw "the tag says $wanted but Cargo.toml says $fromToml. Bump the version first."
          }
          "version=$wanted" >> $env:GITHUB_OUTPUT

      - name: Build all three Windows variants
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $variants = @(
            @{ name = "standard"; features = "--no-default-features"; variant = ""; exeName = "caprust-app.exe"; setupSuffix = "" },
            @{ name = "cuda";     features = "--no-default-features --features gpu-cuda";     variant = "-cuda"; exeName = "caprust-app-cuda.exe"; setupSuffix = "-cuda" },
            @{ name = "directml"; features = "--no-default-features --features gpu-directml"; variant = "-directml"; exeName = "caprust-app-directml.exe"; setupSuffix = "-directml" }
          )
          New-Item -ItemType Directory -Force -Path installer\staging | Out-Null
          New-Item -ItemType Directory -Force -Path release | Out-Null
          foreach ($var in $variants) {
            Write-Host "=== Building $($var.name) ==="
            # Use a variant-specific target dir so cargo doesn't reuse
            # artifacts from a previous variant's build (which would
            # produce identical CPU-only EXEs for all three).
            $targetDir = "target\release-$($var.name)"
            cargo build --release -p caprust-app --target-dir $targetDir ($var.features -split ' ')
            Copy-Item "$targetDir\release\caprust-app.exe" "installer\staging\$($var.exeName)" -Force
            # Build the installer for this variant
            $iscc = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
              "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $iscc) {
              $found = @()
              foreach ($root in @("${env:ProgramFiles(x86)}", "${env:ProgramFiles}", "${env:LOCALAPPDATA}\Programs")) {
                if (Test-Path $root) {
                  $found += Get-ChildItem -Path $root -Directory -Filter 'Inno Setup*' -ErrorAction SilentlyContinue | ForEach-Object {
                    Join-Path $_.FullName 'ISCC.exe'
                  } | Where-Object { Test-Path $_ }
                }
              }
              $iscc = $found | Select-Object -First 1
            }
            if (-not $iscc) { throw "ISCC.exe not found" }
            & $iscc "/DMyAppVersion=$v" "/DMyAppVariant=$($var.variant)" "/DMyAppExeName=$($var.exeName)" installer\caprust.iss
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed for $($var.name)" }
            Copy-Item "installer\dist\CapRust-$v-win64-setup$($var.setupSuffix).exe" "release\CapRust-$v-win64-setup$($var.setupSuffix).exe" -Force
            # Pack the portable zip for this variant
            Compress-Archive -Path "installer\staging\$($var.exeName)" -DestinationPath "release\caprust-$v-windows$($var.setupSuffix).zip" -CompressionLevel Optimal
            Write-Host "  $($var.name): EXE + installer + zip ready"
          }
          Get-ChildItem release | ForEach-Object { Write-Host ("  " + $_.Name + "  " + $_.Length) }

      - name: Upload the unsigned release files
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: caprust-release-unsigned
          path: release
          if-no-files-found: error
          retention-days: 7

      - name: Request the signature
        # Only once SignPath has approved the project and the secrets
        # exist. Before that the release is published unsigned, which is
        # where the beta has been anyway.
        id: sign
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ env.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ secrets.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}'
          artifact-configuration-slug: '${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}'
          github-artifact-id: '${{ steps.upload.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: signed
          parameters: |
            version: "${{ steps.version.outputs.version }}"

      - name: Collect the signed files
        if: ${{ steps.sign.outputs.signing-request-id != '' }}
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          @("CapRust-$v-win64-setup.exe", "CapRust-$v-win64-setup-cuda.exe", "CapRust-$v-win64-setup-directml.exe",
            "caprust-app.exe", "caprust-app-cuda.exe", "caprust-app-directml.exe") | ForEach-Object {
            $src = "signed\$_"
            $dst = "release\$_"
            if (Test-Path $src) { Copy-Item $src $dst -Force }
          }

      - name: Verify the signatures
        if: ${{ steps.sign.outputs.signing-request-id != '' }}
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $v = "${{ steps.version.outputs.version }}"
          @("CapRust-$v-win64-setup.exe", "CapRust-$v-win64-setup-cuda.exe", "CapRust-$v-win64-setup-directml.exe",
            "caprust-app.exe", "caprust-app-cuda.exe", "caprust-app-directml.exe") | ForEach-Object {
            $path = "release\$_"
            if (-not (Test-Path $path)) { return }
            $sig = Get-AuthenticodeSignature $path
            Write-Host ("  $_ status: " + $sig.Status)
            if ($sig.Status -ne 'Valid') {
              throw "the signature for $_ is $($sig.Status), not Valid"
            }
          }

      - name: Pack the portable zip
        shell: pwsh
        run: |
          # Portable zips are already packed in the "Build all three Windows
          # variants" step above; nothing to do here.

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $files = @(Get-ChildItem release -File | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw "nothing to publish" }
          # Build the gh args as an array so each flag/value stays separate
          # (avoids PowerShell string-splitting issues with --notes-file).
          $params = @("release", "create", "v$v")
          $params += $files
          $params += @("--title", "v$v")
          $notesFile = "release_notes_v$v.md"
          if (Test-Path $notesFile) {
            $params += @("--notes-file", $notesFile)
          } else {
            $params += "--generate-notes"
          }
          # Release may already exist from a prior run of the same tag;
          # that's fine — assets are clobbered in the next step either way.
          gh $params 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release create returned $LASTEXITCODE (release may already exist, continuing)"
          } else {
            Write-Host "published v$v"
          }
          exit 0

      - name: Upload assets to release
        # Always runs: uploads/clobbers assets whether the release was
        # just created above or already existed from a previous run.
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $files = @(Get-ChildItem release -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) {
            Write-Host "nothing to upload"
            exit 0
          }
          gh release upload "v$v" @files --clobber
          Write-Host "uploaded assets to v$v"

  build-linux:
    name: Linux release
    needs: [build-windows]
    runs-on: ubuntu-22.04
    env:
      CMAKE_ARGS: -DGGML_NATIVE=OFF
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config clang libclang-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgtk-3-dev \
            libasound2-dev

      - uses: dtolnay/rust-toolchain@1.92.0
      # Bust: the runner moved from 24.04 to 22.04, and the old cache
      # carries build-script binaries linked against glibc 2.39.
      - uses: Swatinem/rust-cache@v2
        with:
          key: v2-22.04
      - run: cargo build --release -p caprust-app --no-default-features

      # A .deb, so a Debian or Ubuntu box can install with dpkg -i
      # instead of unpacking a tarball by hand.
      - name: Build the .deb
        run: |
          VERSION="$(cat Cargo.toml | grep -m1 '^version' | cut -d'"' -f2)"
          mkdir -p pkg/DEBIAN pkg/usr/bin pkg/usr/share/applications pkg/usr/share/icons/hicolor/128x128/apps
          cat > pkg/DEBIAN/control <<EOF
          Package: caprust
          Version: $VERSION
          Section: video
          Priority: optional
          Architecture: amd64
          Installed-Size: $(( $(stat -c%s target/release/caprust-app) / 1024 ))
          Depends: libgtk-3-0, libasound2
          Maintainer: Domica <[EMAIL]>
          Homepage: https://github.com/Domica/CapRust
          Description: Social-first video editor in Rust
           A native video editor for short-form creators.
           No cloud, no telemetry, MIT licensed.
          EOF
          cp target/release/caprust-app pkg/usr/bin/caprust
          cp docs/logo.png pkg/usr/share/icons/hicolor/128x128/apps/caprust.png
          cat > pkg/usr/share/applications/caprust.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=CapRust
          Comment=Social-first video editor
          Exec=caprust
          Icon=caprust
          Categories=AudioVideo;Video;AudioVideoEditing;
          Terminal=false
          EOF
          dpkg-deb --build --root-owner-group pkg "caprust_${VERSION}_amd64.deb"
          echo "Built caprust_${VERSION}_amd64.deb ($(stat -c%s "caprust_${VERSION}_amd64.deb") bytes)"
          # Smoke test: the package unpacks and the binary is there.
          dpkg-deb -c "caprust_${VERSION}_amd64.deb" | grep -q 'usr/bin/caprust'
          dpkg-deb --info "caprust_${VERSION}_amd64.deb" | grep -q 'Package: caprust'

      - name: Upload .deb to release
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          VERSION="$(cat Cargo.toml | grep -m1 '^version' | cut -d'"' -f2)"
          gh release upload "v${VERSION}" "caprust_${VERSION}_amd64.deb" --clobber

  build-android:
    name: Android release
    needs: [build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The engine, for the phone.
      #
      # The same Rust the desktop runs, built for the phone's
      # architecture. It goes into the APK's native library folder,
      # which is the only place an Android app may run a binary from.
      # Two architectures: a phone is arm64, an emulator on a laptop is
      # x86_64. The app finds the engine in its own native library
      # folder, which Android fills for the architecture it runs on,
      # so the APK has to carry both.
      - name: Install the Android targets
        run: |
          TOOLCHAIN="$(cat rust-toolchain.toml | grep channel | cut -d'"' -f2)"
          rustup target add aarch64-linux-android --toolchain "$TOOLCHAIN"
          rustup target add armv7-linux-androideabi --toolchain "$TOOLCHAIN"
          rustup target add x86_64-linux-android --toolchain "$TOOLCHAIN"
          rustup target add i686-linux-android --toolchain "$TOOLCHAIN"

      - name: Point cargo at the NDK clang wrappers
        run: |
          NDK="$ANDROID_NDK_ROOT"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android21-clang"
            echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android21-clang"
            echo "CXX_aarch64_linux_android=$BIN/aarch64-linux-android21-clang++"
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$BIN/armv7a-linux-androideabi21-clang"
            echo "CC_armv7_linux_androideabi=$BIN/armv7a-linux-androideabi21-clang"
            echo "CXX_armv7_linux_androideabi=$BIN/armv7a-linux-androideabi21-clang++"
            echo "CARGO_TARGET_I686_LINUX_ANDROID_LINKER=$BIN/i686-linux-android21-clang"
            echo "CC_i686_linux_android=$BIN/i686-linux-android21-clang"
            echo "CXX_i686_linux_android=$BIN/i686-linux-android21-clang++"
            echo "AR_i686_linux_android=$BIN/llvm-ar"
            echo "RANLIB_i686_linux_android=$BIN/llvm-ranlib"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$BIN/x86_64-linux-android21-clang"
            echo "CC_x86_64_linux_android=$BIN/x86_64-linux-android21-clang"
            echo "CXX_x86_64_linux_android=$BIN/x86_64-linux-android21-clang++"
            echo "AR_aarch64_linux_android=$BIN/llvm-ar"
            echo "RANLIB_aarch64_linux_android=$BIN/llvm-ranlib"
            echo "AR_armv7_linux_androideabi=$BIN/llvm-ar"
            echo "RANLIB_armv7_linux_androideabi=$BIN/llvm-ranlib"
            echo "ANDROID_API=21"
            echo "PATH=$BIN:$PATH"
          } >> "$GITHUB_ENV"
          echo "export PATH=\"$BIN:\$PATH\"" >> "$GITHUB_PATH"

      - name: Build the engine for the phone
        run: |
          cargo build --release -p caprust-android --target aarch64-linux-android --bin caprust-androidd
          cargo build --release -p caprust-android --target armv7-linux-androideabi --bin caprust-androidd
          cargo build --release -p caprust-android --target x86_64-linux-android --bin caprust-androidd
          cargo build --release -p caprust-android --target i686-linux-android --bin caprust-androidd

      # The renderer. It has to be in the APK: an Android app may only
      # run a binary out of its own native library folder, and the
      # engine renders by calling ffmpeg.
      #
      # Built from source, because a third-party binary in a release is
      # a thing that has to be trusted, and because the old prebuilt
      # Android builds are from 2016 and have no xfade in them, so no
      # transitions.
      #
      # The build is cached: the first one takes twenty minutes, the
      # rest take a minute.
      # The ffmpeg build takes twenty minutes an architecture, and
      # the nightly runs on every push. The binaries are cached, so
      # only the first run pays for them.
      - name: Restore the ffmpeg builds
        uses: actions/cache@v4
        with:
          path: android/ffmpeg
          key: android-ffmpeg-${{ hashFiles('android/build-ffmpeg.sh') }}

      - name: Build ffmpeg for the phone
        # Not fatal yet: the recipe is new, and the APK is worth
        # building without a renderer in it. The check that the
        # ffmpeg is in the APK comes when the recipe works.
        continue-on-error: true
        run: |
          for ABI in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android; do
            echo "=== ffmpeg for $ABI ==="
            bash android/build-ffmpeg.sh "$ABI"
          done

      # gradle from the runner image rather than a wrapper: the wrapper
      # would mean committing a binary jar for a build that only needs
      # assembleDebug. rust-toolchain.toml pins the Rust version, not
      # Gradle, so nothing here is coupled to it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        # Debug, not release: there is no signing config, and an
        # unsigned release APK cannot be sideloaded anyway. Debug is
        # signed with the default debug key, which is enough to install
        # by tapping the file on the device.
        working-directory: android
        run: gradle --no-daemon assembleDebug

      # A build with the Kotlin plugin missing exits 0 and produces an
      # APK whose classes.dex is a few kilobytes of nothing: the
      # manifest still names MainActivity, so it installs and then dies
      # on launch. `assembleDebug` succeeding is not evidence the app is
      # in there. This is.
      - name: Verify the APK actually contains the app
        working-directory: android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "no APK at $APK"; exit 1; }
          SIZE=$(stat -c%s "$APK")
          echo "APK: $SIZE bytes"
          # Below ~200 KB means no compiled app code got in.
          if [ "$SIZE" -lt 204800 ]; then
            echo "APK is too small to contain the app. Check that the"
            echo "Kotlin plugin is applied; without it .kt files are skipped"
            echo "and the build still succeeds."
            exit 1
          fi
          unzip -l "$APK" | grep -q 'classes.dex' || {
            echo "no classes.dex in the APK"; exit 1; }
          # The engine has to be in there too. An APK without it
          # installs and then says the engine is missing, which looks
          # like a bug in the app rather than a build that skipped a
          # step.
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libcaprust-androidd.so' || {
            echo "no engine for the phone in the APK"; exit 1; }
          unzip -l "$APK" | grep -q 'lib/x86_64/libcaprust-androidd.so' || {
            echo "no engine for the emulator in the APK"; exit 1; }
          unzip -l "$APK" | grep -q 'lib/x86/libcaprust-androidd.so' || {
            echo "no engine for the 32-bit emulator in the APK"; exit 1; }
          echo "APK looks real."

      - name: Upload APK to release
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          VERSION="$(cat Cargo.toml | grep -m1 '^version' | cut -d'"' -f2)"
          cp android/app/build/outputs/apk/debug/app-debug.apk "caprust-${VERSION}.apk"
          gh release upload "v${VERSION}" "caprust-${VERSION}.apk" --clobber
